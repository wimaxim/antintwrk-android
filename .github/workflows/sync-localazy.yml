name: Sync Localazy
on:
  workflow_dispatch:
  schedule:
    # At 00:00 on every Monday UTC
    - cron: '0 0 * * 1'

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  sync-localazy:
    runs-on: ubuntu-latest
    if: github.repository == 'wimaxim/antintwrk-android'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-localazy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Setup Localazy
        run: |
          curl -sS https://dist.localazy.com/debian/pubkey.gpg | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/localazy.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/localazy.gpg] https://maven.localazy.com/repository/apt/ stable main" | sudo tee /etc/apt/sources.list.d/localazy.list
          sudo apt-get update && sudo apt-get install localazy
      - name: Configure screenshot failure diagnostics
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/translation-test-diagnostics.gradle" <<'GRADLE'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              failFast = true
              testLogging { exceptionFormat = 'FULL' }
            }
          }
          GRADLE
      - name: Run Localazy script
        shell: bash
        run: |
          set -euo pipefail
          ./tools/localazy/downloadStrings.sh --all
          python3 ./tools/localazy/preserveTemporaryResources.py
          ./tools/localazy/importSupportedLocalesFromLocalazy.py
          ./tools/test/generateAllScreenshots.py
          ./tools/manifest/aaptDump.sh
      - name: Create Pull Request for Strings
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: Sync Strings from Localazy
          title: Sync Strings
          body: |
            - Update Strings from Localazy
          branch: sync-localazy
          base: ${{ github.event.repository.default_branch }}
          labels: enhancement
      - name: Upload translation test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translation-test-diagnostics
          path: |
            tests/uitests/build/test-results/
            tests/uitests/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove screenshot diagnostics init script
        if: always()
        run: rm -f "$GRADLE_USER_HOME/init.d/translation-test-diagnostics.gradle"
